<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jaga Mamah</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<!-- Aturan Firestore sama seperti versi lama. Tambahkan ?demo di alamat untuk mencoba tanpa database. -->
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#12302a;--mut:#58706a;--line:#d5e0db;--pri:#0b6b5a;--on:#fff;--bad:#b83420;--badbg:#fde9e4;--warn:#835400;--ok:#14703d;--okbg:#e1f4e8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a17;--card:#162622;--ink:#e9f3ef;--mut:#9bb2aa;--line:#294039;--pri:#43c8a8;--on:#05211b;--bad:#ff9a84;--badbg:#3b1e18;--warn:#f0c05a;--ok:#74d9a0;--okbg:#12311f}}
*{box-sizing:border-box;margin:0}
body{font:500 18px/1.4 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:520px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px 48px;display:grid;gap:16px}
#v{display:grid;gap:14px}
h1{font-size:24px;font-weight:800}h2{font-size:21px;font-weight:800}
button,select,input{font:inherit;color:inherit}
button{border:0;border-radius:14px;min-height:56px;padding:0 20px;background:var(--pri);color:var(--on);font-weight:800;cursor:pointer}
button.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}
button.g{min-height:44px;padding:0 14px;background:none;color:var(--bad);border:2px solid currentColor}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar span{display:flex;gap:8px}
.bar button{min-height:44px;padding:0 12px}
small,.mut{display:block;color:var(--mut);font-size:16px;font-weight:500}
.now{border-radius:20px;padding:20px;background:var(--okbg);color:var(--ok)}.now.e{background:var(--badbg);color:var(--bad)}
.now b{display:block;font-size:24px;line-height:1.2;font-weight:800}.now small{color:inherit;margin-top:4px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.card.e{border-color:var(--bad)}.card.w{border-color:var(--warn)}
.card b,.row b{font-size:20px}
.row{display:grid;grid-template-columns:96px 1fr;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.row.mine{grid-template-columns:1fr auto;align-items:center}
details{display:grid;gap:12px}
summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--card);border:2px solid var(--line);border-radius:14px;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:11px;height:11px;border:solid currentColor;border-width:0 3px 3px 0;transform:translateY(-3px) rotate(45deg);transition:transform .2s}
details[open]>summary::after{transform:translateY(3px) rotate(-135deg)}
@media(prefers-reduced-motion:reduce){summary::after{transition:none}}
.acts{display:flex;gap:10px}.acts button{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{border:0;margin:auto 0 0;width:100%;max-width:none;max-height:90vh;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px max(20px,env(safe-area-inset-bottom));background:var(--card);color:var(--ink)}
@media(min-width:560px){dialog{margin:auto;width:480px;border-radius:24px}}
dialog::backdrop{background:#0009}dialog[open]{display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:700}
select,input{min-height:52px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}.names button{min-height:68px;font-size:22px}
#ml{display:grid;gap:8px;max-height:50vh;overflow:auto;align-content:start}
.m{background:var(--bg);border-radius:14px;padding:8px 12px;max-width:85%;justify-self:start}.m.me{justify-self:end;background:var(--okbg)}
.m p{overflow-wrap:anywhere}.m time{font-size:13px;color:var(--mut)}
.in{display:grid;grid-template-columns:1fr auto;gap:8px}
#toast{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:496px;margin:auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:9}
#toast[hidden]{display:none}#toast button{min-height:44px;background:var(--bg);color:var(--ink)}
.bad{color:var(--bad)}
</style></head>
<body><main>
<div class="bar"><h1>Jaga Mamah</h1><span><button class="sec" id="hi" aria-label="Ganti nama"></button><button class="sec" id="chb" aria-label="Chat caregiver">💬</button></span></div>
<div id="v"></div></main>

<dialog id="nm"><h2>Anda siapa?</h2><div class="names" id="nl"></div></dialog>

<dialog id="cs"><h2>Pilih jam sendiri</h2>
<label>Tanggal<select id="fd"></select></label>
<div class="two"><label>Mulai<select id="fs"></select></label><label>Selesai<select id="fe"></select></label></div>
<b id="sm"></b>
<label>Ulangi<select id="fr"><option value="o">Sekali saja</option><option value="d">Tiap hari, 7 hari</option><option value="w">Tiap minggu, 4 minggu</option></select></label>
<p id="er" class="bad"></p>
<div class="two"><button class="sec" id="fc">Batal</button><button id="fv">Simpan</button></div></dialog>

<dialog id="ch"><div class="bar"><h2>Chat caregiver</h2><button class="sec" id="cx">Tutup</button></div><div id="ml"></div>
<div class="in"><input id="mi" maxlength="500" placeholder="Tulis pesan" autocomplete="off"><button id="ms">Kirim</button></div></dialog>
<div id="toast" hidden></div>

<script type="module">
const PASIEN="Mamah",NAMES=["Adi","Indri","Rani","Rendra","Teja","Tia"];
const cfg={apiKey:"AIzaSyBvjk2NRrxJ1T-FuMYEG3iVAhEIi37xgYk",authDomain:"jajankuy-web.firebaseapp.com",projectId:"jajankuy-web",storageBucket:"jajankuy-web.firebasestorage.app",messagingSenderId:"439643042694",appId:"1:439643042694:web:3808fd644307f9205ff207",measurementId:"G-D9V1H4H67B"};
const H=36e5,D=24*H,$=s=>document.querySelector(s),p2=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tm=t=>p2(new Date(t).getHours())+".00",day0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return+d},now=()=>Math.floor(Date.now()/H)*H;
const te=t=>t==day0(t-1)+D?"24.00":tm(t); // jam selesai; tengah malam ditulis 24.00
const dl=t=>{const T=day0(Date.now()),d=day0(t);return d==T?"Hari ini":d==T+D?"Besok":new Date(t).toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"})};
const PART=[["🌃","Dini hari"],["🌅","Pagi"],["☀️","Siang"],["🌙","Malam"]],O=new Set();
let me=localStorage.cg_name||"",shifts=[],msgs=[],slots=new Map(),api=null;
if(!NAMES.includes(me))me="";

const cnt=t=>new Set((slots.get(t)||[]).map(x=>x.name)).size;
// potongan jam per bagian hari (6 jam) yang jumlah penjaganya tepat = level
function chunks(level){const out=[],n=now();
 for(let i=0;i<14;i++)for(let p=0;p<4;p++){const a=day0(Date.now())+i*D+p*6*H;let c=null;
  for(let t=a;t<a+6*H;t+=H){if(t>=n&&cnt(t)==level){if(c)c.e=t+H;else out.push(c={s:t,e:t+H,p})}else c=null}}
 return out}
const who=d=>{const m=new Map();shifts.forEach(s=>{if(s.start<d+D&&s.end>d)m.set(s.name,[...(m.get(s.name)||[]),[Math.max(s.start,d),Math.min(s.end,d+D)]])});return[...m]};
const mg=r=>{r.sort((a,b)=>a[0]-b[0]);const o=[];r.forEach(x=>{const l=o[o.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else o.push([...x])});return o};

function draw(){
 slots=new Map();shifts.forEach(s=>{for(let t=s.start;t<s.end;t+=H)slots.set(t,[...(slots.get(t)||[]),s])});
 const n=now(),E=chunks(0),W=chunks(1),eh=E.reduce((a,c)=>a+(c.e-c.s)/H,0),
  mine=shifts.filter(s=>s.name==me&&s.end>Date.now()).sort((a,b)=>a.start-b.start),
  on=[...new Set((slots.get(n)||[]).map(s=>s.name))].sort(),
  until=nm=>{let t=n;while((slots.get(t)||[]).some(s=>s.name==nm))t+=H;return t},
  at=t=>(dl(t)=="Hari ini"?"":dl(t).toLowerCase()+" ")+te(t),op=id=>O.has(id)?" open":"",
  card=(c,k)=>`<div class="card ${k}"><div><b>${PART[c.p][0]} ${dl(c.s)} · ${PART[c.p][1]}</b><small>${tm(c.s)} – ${te(c.e)} · ${(c.e-c.s)/H} jam</small></div><button data-a="${c.s}" data-b="${c.e}">${k=="e"?"Saya jaga":"Saya temani"}</button></div>`,
  mrow=s=>`<div class="row mine"><div><b>${dl(s.start)}</b><small>${tm(s.start)} – ${te(s.end)}${day0(s.end-1)>day0(s.start)?" (besok)":""}</small></div><button class="g" data-x="${s.id}">Batal</button></div>`;
 $("#hi").textContent="👤 "+(me||"Pilih nama");
 let h=on.length?`<div class="now"><b>Sekarang dijaga ${on.map(x=>esc(x)+(x==me?" (Anda)":"")).join(" & ")}</b><small>sampai ${at(Math.min(...on.map(until)))}</small></div>`
  :`<div class="now e"><b>Sekarang belum ada yang jaga</b></div>`;
 h+=E.length?`<h2>Perlu dijaga · ${eh} jam</h2><small>Ketuk “Saya jaga” pada jam yang bisa Anda isi.</small>`+E.slice(0,4).map(c=>card(c,"e")).join("")
  +(E.length>4?`<details id="e"${op("e")}><summary>Lihat ${E.length-4} lainnya</summary>${E.slice(4).map(c=>card(c,"e")).join("")}</details>`:"")
  :`<div class="now"><b>Semua jam sudah ada yang jaga 🎉</b><small>Terima kasih sudah menjaga ${PASIEN}.</small></div>`;
 if(W.length)h+=`<details id="w"${op("w")}><summary>Baru 1 penjaga (${W.length}) · boleh ditemani</summary>${W.map(c=>card(c,"w")).join("")}</details>`;
 if(mine.length)h+=`<h2>Jadwal Anda</h2>`+mine.slice(0,3).map(mrow).join("")+(mine.length>3?`<details id="m"${op("m")}><summary>Lihat ${mine.length-3} lainnya</summary>${mine.slice(3).map(mrow).join("")}</details>`:"");
 h+=`<details id="k"${op("k")}><summary>Lihat Semua yang Jaga</summary>`+[...Array(7)].map((_,i)=>{const d=day0(Date.now())+i*D,w=who(d);
  return `<div class="row"><b>${dl(d)}</b><div>${w.length?w.map(([nm,r])=>`<small><b style="font-size:16px;color:var(--ink)">${esc(nm)}</b> ${mg(r).map(([a,b])=>tm(a)+"–"+te(b)).join(", ")}</small>`).join(""):`<small>Belum ada</small>`}</div></div>`}).join("")+`</details>`;
 h+=`<div class="acts">${E.length?`<button class="sec" id="wa">Kabari grup WA</button>`:""}<button class="sec" id="cu">Pilih jam sendiri</button></div>`;
 $("#v").innerHTML=h}

function toast(m,l,f){const e=$("#toast");e.innerHTML=`<span>${esc(m)}</span>`+(l?`<button>${esc(l)}</button>`:"");e.hidden=false;
 if(l)e.lastChild.onclick=()=>{e.hidden=true;f()};clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,l?7000:3500)}
const askName=()=>$("#nm").showModal();

function save(items){if(!me)return askName();if(!api)return toast("Database belum terhubung");
 const ids=api.add(items),s=items[0];
 toast("Tersimpan: "+(items.length>1?items.length+" jadwal":`${dl(s[0])} ${tm(s[0])}–${te(s[1])}`),"Urungkan",()=>ids.forEach(i=>api.del(i)))}
function cancel(id){const s=shifts.find(x=>x.id==id);
 if(s&&confirm(`Batalkan jaga ${dl(s.start)} ${tm(s.start)}–${te(s.end)}?`)){api.del(id).catch(e=>toast("Gagal membatalkan: "+e.code));toast("Jadwal dibatalkan","Kabari grup WA",share)}}
function share(){const g=chunks(0).reduce((a,c)=>{const l=a[a.length-1];l&&l.e==c.s?l.e=c.e:a.push({...c});return a},[]);
 if(!g.length)return toast("Semua jam sudah terisi 🎉");
 open("https://wa.me/?text="+encodeURIComponent(`Jaga ${PASIEN} yang masih kosong:\n`+g.slice(0,15).map(c=>`• ${dl(c.s)}, ${tm(c.s)}–${te(c.e)}`).join("\n")+`\n\nIsi di sini: ${location.href.split("?")[0]}`))}

$("#v").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset;
 if(k.a)save([[+k.a,+k.b]]);else if(k.x)cancel(k.x);else if(b.id=="wa")share();else if(b.id=="cu")custom()};
document.addEventListener("toggle",e=>{if(e.target.tagName=="DETAILS")e.target.open?O.add(e.target.id):O.delete(e.target.id)},true);

// nama: satu ketukan
$("#nl").innerHTML=NAMES.map(n=>`<button class="sec" data-n="${n}">${n}</button>`).join("");
$("#nl").onclick=e=>{const n=e.target.dataset.n;if(!n)return;me=n;localStorage.cg_name=n;$("#nm").close();draw();drawChat()};
$("#nm").addEventListener("cancel",e=>{if(!me)e.preventDefault()});$("#hi").onclick=askName;

// jam sendiri (pilihan lanjutan)
const hrs=[...Array(24)].map((_,h)=>`<option value="${h}">${p2(h)}.00</option>`).join("");
$("#fs").innerHTML=$("#fe").innerHTML=hrs;
$("#fd").innerHTML=[...Array(14)].map((_,i)=>{const d=day0(Date.now())+i*D;return `<option value="${d}">${i<2?dl(d)+", ":""}${new Date(d).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}</option>`}).join("");
const calc=()=>{const d=+$("#fd").value,s=d+$("#fs").value*H;let e=d+$("#fe").value*H;if(e<=s)e+=D;return[s,e]};
const upd=()=>{const[s,e]=calc();$("#sm").textContent=`${dl(s)} ${tm(s)} → ${dl(e)} ${te(e)} · ${(e-s)/H} jam`};
["fd","fs","fe"].forEach(i=>$("#"+i).onchange=upd);
function custom(){if(!me)return askName();const c=chunks(0)[0];
 $("#fd").value=c?day0(c.s):day0(Date.now());$("#fs").value=c?new Date(c.s).getHours():18;$("#fe").value=c?new Date(c.e).getHours():0;
 $("#fr").value="o";$("#er").textContent="";upd();$("#cs").showModal()}
$("#fc").onclick=()=>$("#cs").close();
$("#fv").onclick=()=>{const[s0,e0]=calc(),[n,st]={o:[1,0],d:[7,D],w:[4,7*D]}[$("#fr").value],items=[];
 for(let i=0;i<n;i++){const s=s0+i*st,e=e0+i*st;if(e<=Date.now())continue;let c=0;for(let t=s;t<e;t+=H)if((slots.get(t)||[]).some(x=>x.name==me))c=1;if(!c)items.push([s,e])}
 if(!items.length)return $("#er").textContent="Anda sudah punya jadwal di jam itu, atau jamnya sudah lewat.";
 $("#cs").close();save(items)};

// chat (lembar kecil, bukan halaman)
function drawChat(){$("#ml").innerHTML=[...msgs].reverse().map(m=>`<div class="m${m.name==me?" me":""}">${m.name==me?"":`<small>${esc(m.name)}</small>`}<p>${esc(m.text)}</p><time>${(m.ts?m.ts.toDate():new Date()).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</time></div>`).join("")||`<p class="mut">Belum ada pesan.</p>`;$("#ml").scrollTop=1e9}
$("#chb").onclick=()=>{$("#ch").showModal();$("#ml").scrollTop=1e9};$("#cx").onclick=()=>$("#ch").close();
function send(){const i=$("#mi"),t=i.value.trim();if(!t||!me||!api)return;i.value="";Promise.resolve(api.say(t)).catch(e=>{i.value=t;toast("Pesan gagal terkirim: "+e.code)})}
$("#ms").onclick=send;$("#mi").onkeydown=e=>{if(e.key=="Enter")send()};

draw();drawChat();if(!me)askName();setInterval(draw,3e4);

if(location.search.includes("demo")){ // contoh data tanpa database
 const t=day0(Date.now());shifts=[{id:"1",name:"Tia",start:t+6*H,end:t+18*H},{id:"2",name:"Rani",start:t+18*H,end:t+D+2*H},{id:"3",name:"Adi",start:t+D+8*H,end:t+D+14*H}];msgs=[{name:"Tia",text:"Obat pagi sudah diminum."}];
 api={add:it=>it.map(([s,e],i)=>{const id="d"+Date.now()+i;shifts.push({id,name:me,start:s,end:e});draw();return id}),del:async id=>{shifts=shifts.filter(s=>s.id!=id);draw()},say:async x=>{msgs.unshift({name:me,text:x});drawChat()}};
 draw();drawChat()}
else try{
 const A=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),f=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"),db=f.getFirestore(A.initializeApp(cfg));
 api={add(it){const b=f.writeBatch(db),ids=it.map(([s,e])=>{const r=f.doc(f.collection(db,"shifts"));b.set(r,{name:me,start:s,end:e,at:f.serverTimestamp()});return r.id});
   b.commit().catch(x=>toast("Gagal menyimpan: "+x.code));return ids},
  del:id=>f.deleteDoc(f.doc(db,"shifts",id)),
  say:x=>f.addDoc(f.collection(db,"messages"),{name:me,text:x,ts:f.serverTimestamp()})};
 f.onSnapshot(f.query(f.collection(db,"shifts"),f.where("end",">",day0(Date.now())-7*D)),s=>{shifts=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast("Gagal memuat jadwal: "+e.code));
 f.onSnapshot(f.query(f.collection(db,"messages"),f.orderBy("ts","desc"),f.limit(100)),s=>{msgs=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:"estimate"})}));drawChat()},e=>toast("Gagal memuat chat: "+e.code));
}catch(e){toast("Tidak bisa terhubung ke database")}
</script></body></html>
