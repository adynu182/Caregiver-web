<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jadwal Jaga Mamah</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@400..700,0..1&display=block" rel="stylesheet">
<style>
:root{--rh:56px;--bg:#eef3f5;--ink:#14262e;--mut:#55696f;--pri:#0b5d73;--ok:#15803d;--okb:#d9f5e3;--wn:#b45309;--wnb:#fdecc8;--bd:#b91c1c;--bdb:#fddcdc}
*{box-sizing:border-box;margin:0}
body{font:400 17px/1.4 'Atkinson Hyperlegible',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:0 14px calc(100px + env(safe-area-inset-bottom))}
b,h1,h2{font-weight:700}
header{padding:calc(18px + env(safe-area-inset-top)) 2px 4px}
h1{font-size:26px}h2{font-size:20px}
.sub{color:var(--mut);font-size:15px}
.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0b5d7326}
button{font:inherit;font-weight:700;border:0;border-bottom:6px solid #0003;border-radius:14px;min-height:50px;padding:0 16px;background:#e1ebee;color:var(--ink);box-shadow:inset 0 2px 0 #fff9,0 4px 6px #0b5d7340;cursor:pointer;transition:transform .07s}
button:active{border-bottom-width:2px;transform:translateY(4px);box-shadow:none}
.pri{background:var(--pri);color:#fff}
#mode{background:var(--wnb);padding:10px 14px;border-radius:14px;margin-top:10px;font-size:15px}
#kc{--c:var(--pri);--b:#fff;position:relative;background:var(--b);border-left:10px solid var(--c)}
#kc>b,#kc .big{padding-right:60px}#kc .big{color:var(--c)}
#kc .kic{position:absolute;top:14px;right:14px}
#kc button{width:100%;margin-top:10px;background:#fff}
.big{font-size:21px;font-weight:700;margin-top:4px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch h2{flex:1;text-align:center;line-height:1.2}
.ch button{flex:none;width:52px;padding:0;font-size:26px}
#cl{padding:16px 8px}.cw{padding:0 8px}#dh{margin-top:14px;padding:14px 8px 0;border-top:2px solid #e3ebee}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-top:14px}
.dow{display:block;font-size:13px;color:var(--mut)}
.day{position:relative;min-height:80px;padding:6px 0 4px;background:#f3f7f8;border-radius:12px;font-weight:400}
.day b{display:inline-block;margin-top:2px;font-size:18px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:3px;padding:0 3px}.dots i{width:7px;height:7px;border-radius:50%}
.lgd{display:flex;flex-wrap:wrap;gap:4px 10px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.day small{position:absolute;top:0;right:1px;font-size:11px}
.day.sel{outline:3px solid var(--pri);background:#fff}
.day.today b{background:var(--pri);color:#fff;border-radius:10px;padding:0 5px}
.ok{--c:var(--ok);--b:var(--okb)}.wn{--c:var(--wn);--b:var(--wnb)}.bd{--c:var(--bd);--b:var(--bdb)}.pd{--c:#b6c3c8}.day.pd{opacity:.6}
.lg{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.lg button{min-height:40px}
.pill{display:inline-block;padding:6px 12px;border-radius:20px;background:var(--b);color:var(--c);font-weight:700;margin:6px 0 4px}
.kd{background:var(--wnb);border-radius:14px;padding:10px 12px;margin:8px 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#eef3f500,var(--bg) 35%)}
.bar button{width:100%;min-height:58px;font-size:19px;border-radius:18px}
dialog{border:0;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;margin:auto auto 0;max-height:94dvh;color:var(--ink)}
dialog::backdrop{background:#000a}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{font:inherit;width:100%;min-height:50px;border:2px solid #c5d4d9;border-radius:12px;padding:6px 10px;background:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{--c:var(--pri);flex:1 0 30%;border:3px solid var(--c);border-bottom-width:8px;background:#fff}.opts button:active{border-bottom-width:3px}
.opts .on{background:var(--c);color:#fff}
.two{display:flex;gap:8px;margin-top:16px}.two button{flex:1}.two>div{flex:1}
.kk{--c:var(--pri);--b:#e1ebee;display:flex;align-items:center;gap:12px;margin:10px 0;padding:12px 10px 12px 12px;background:var(--b);border-left:10px solid var(--c);border-radius:18px;box-shadow:0 1px 3px #0b5d7326}
.kic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--c);display:grid;place-items:center;font-size:25px;box-shadow:inset 0 2px 0 #fff4}
.kbd{flex:1;min-width:0}.kbd>b{display:block;color:var(--c);font-size:18px}
.kdt{font-size:19px;font-weight:700;margin-top:2px}
.kwr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px}.kwr>b{font-size:17px}
.kwh{padding:2px 10px;border-radius:20px;background:var(--c);color:#fff;font-size:14px;font-weight:700}
.kno{margin-top:6px;font-size:15px}
.kk button{flex:none;width:48px;min-height:48px;padding:0;background:#fff}
#kd{display:grid;grid-template-columns:repeat(3,1fr)}#kd button{padding:6px 2px;font-size:15px;line-height:1.25}
.tgh,.tgb{display:grid;grid-template-columns:42px repeat(6,minmax(0,1fr))}
.tgh{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:#fff;padding-bottom:6px}
.tgb{position:relative}
.uh{min-height:44px;padding:0;font-size:11px;font-weight:700;border-radius:10px;background:var(--c);color:#fff;margin:0 1px;display:flex;align-items:center;justify-content:center}.plus{--c:var(--pri);font-size:16px}
.tm{height:var(--rh);padding:5px 3px 0 0;font-size:11px;font-weight:700;text-align:right;color:var(--c);background:var(--b);border-bottom:2px solid #fff}
.tm small{display:block;font-size:12px}
.ln{position:relative;border-left:1px solid #dfe7ea;background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--rh) - 1px),#dfe7ea calc(var(--rh) - 1px) var(--rh))}
.ev{position:absolute;left:2px;right:2px;min-height:0;padding:4px 3px;border-radius:8px;border:0;border-left:4px solid var(--c);border-bottom:4px solid #0003;background:var(--g);color:var(--ink);text-align:left;overflow:hidden;font-weight:400}
.ev b{display:block;font-size:11px}.ev small{display:block;font-size:10px}
.nowl{position:absolute;left:0;right:0;height:2px;background:#e11d48;z-index:5;pointer-events:none}
.nowl::before{content:"Sekarang";position:absolute;left:0;top:-8px;padding:0 2px;font-size:9px;font-weight:700;color:#e11d48;background:#fff}
#sb{border-left:10px solid var(--c)}.sbn{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.nm{padding:8px 16px;border-radius:22px;color:#fff;font-weight:700;font-size:18px}
[hidden]{display:none!important}
.gp{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 10px 10px 12px;background:var(--b);border-left:10px solid var(--c);border-radius:18px}
.gp>div{flex:1;min-width:0}.gp>div>b{display:block;color:var(--c)}.gt{font-size:20px;font-weight:700}
.gp button{flex:none;max-width:104px;padding:0 10px;line-height:1.2;background:#fff}
button:disabled{opacity:.5;pointer-events:none}
#tl.old{filter:grayscale(1);pointer-events:none}#tl.old .ev:disabled{opacity:1}
#ct{display:block;width:100%;min-height:50px;margin-top:10px;padding:10px 12px;border:2px solid transparent;border-radius:12px;background:#f3f7f8;color:var(--ink);font:inherit;line-height:1.4;resize:none;overflow:hidden}
#cn.editing #ct{background:#fff;border-color:var(--pri)}
#ce{width:100%;margin-top:10px}
#cn .two{margin-top:10px}
body.ed .bar{display:none}

.mi{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:1.3em;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;vertical-align:middle;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 1,'wght' 600;user-select:none;pointer-events:none}
.ch .mi{font-size:34px}
.bar button,#ce{display:flex;align-items:center;justify-content:center;gap:6px}.bar .mi{font-size:28px}#ce .mi{font-size:24px}
.plus .mi{font-size:24px}.sub .mi{color:var(--pri)}
.kic{color:#fff}.kic .mi{font-size:28px}
#kd .mi{display:block;font-size:30px;margin-bottom:2px;color:var(--c)}#kd .on .mi{color:#fff}
.day small{top:-8px;right:-5px;z-index:1;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0b5d7340;line-height:1}.day small .mi{font-size:16px;color:var(--pri)}
.kd .mi{font-size:22px;color:var(--wn)}.kno .mi{font-size:20px;color:var(--c)}
.kk button .mi{font-size:26px;color:var(--bd)}
</style>
</head>
<body>
<header><h1>Jadwal Jaga Mamah</h1><p class="sub">Setiap jam harus ada minimal 2 orang yang jaga.</p></header>
<div id="mode" hidden>Mode contoh: Firebase belum diisi, data hanya tersimpan di HP ini. Isi file <b>firebase-config.js</b> agar jadwal terlihat oleh semua.</div>
<section id="kc" class="card"></section>
<section class="card" id="sb"></section>
<section class="card" id="cl">
 <div class="cw">
  <div class="ch"><button id="pv" aria-label="Minggu sebelumnya"><span class="mi" aria-hidden="true">chevron_left</span></button><h2 id="mt"></h2><button id="nx" aria-label="Minggu berikutnya"><span class="mi" aria-hidden="true">chevron_right</span></button></div>
  <div class="grid" id="cal"></div>
  <div class="lg"><span class="sub lgd" id="lgd"></span><button id="td">Hari ini</button></div>
 </div>
 <div id="dh"></div>
 <div id="tl"></div>
</section>
<section class="card" id="cn">
  <h2 id="cnh"></h2>
  <textarea id="ct" rows="1" maxlength="2000" aria-label="Catatan" readonly></textarea>
  <button id="ce"></button>
  <div class="two" id="cx" hidden><button id="cb">Batal</button><button class="pri" id="cs">Simpan</button></div>
</section>
<section class="card" id="kr"></section>
<nav class="bar"><button class="pri" id="bj"><span class="mi" aria-hidden="true">add</span>Ambil jadwal jaga</button></nav>

<dialog id="dj"><h2>Ambil jadwal jaga</h2>
  <label>Siapa kamu?</label><div class="opts" id="pn"></div>
  <label for="jd">Tanggal mulai jaga</label><input type="date" id="jd">
  <label>Pilih waktu jaga</label>
  <div class="opts" id="ps"><button data-p="6-14">Pagi<br>06 - 14</button><button data-p="14-22">Siang<br>14 - 22</button><button data-p="22-6">Malam<br>22 - 06</button><button data-p="0-0">Sehari penuh<br>24 jam</button></div>
  <div class="two"><div><label for="js">Dari jam</label><select id="js"></select></div><div><label for="je">Sampai jam</label><select id="je"></select></div></div>
  <p class="sub" id="jp" style="margin-top:10px"></p>
  <div class="two"><button data-close>Batal</button><button class="pri" id="jok">Simpan jadwal</button></div>
</dialog>

<dialog id="dk"><h2>Jadwal kontrol dan terapi</h2><div id="kl"></div>
  <label>Tambah jadwal kontrol atau terapi</label>
  <div class="opts" id="kd"></div>
  <label for="kt">Tanggal</label><input type="date" id="kt">
  <label for="kj">Jam</label><input type="time" id="kj" value="09:00">
  <label for="kn">Catatan (contoh: bawa hasil CT scan)</label><input id="kn" maxlength="120">
  <div class="two"><button data-close>Tutup</button><button class="pri" id="kok">Simpan Jadwal</button></div>
</dialog>

<script type="module">
import {firebaseConfig as C} from './firebase-config.js';
const NAMES={Adi:    '#0072B2', // biru
  Indri:  '#E69F00', // oranye
  Rendra: '#009E73', // hijau kebiruan
  Rani:   '#CC79A7', // pink/magenta lembut
  Teja:   '#6A3D9A', // ungu tua
  Tia:    '#D55E00'};
const KT={Saraf:{n:'Dokter Saraf',i:'neurology',c:'#4338CA',b:'#e6e5fb'},
  Jantung:{n:'Dokter Jantung',i:'cardiology',c:'#BE123C',b:'#fde3ea'},
  Fisioterapi:{n:'Fisioterapi',i:'physical_therapy',c:'#0F766E',b:'#d3f1ea'}};
const kt=d=>KT[d=='Syaraf'?'Saraf':d]||{n:'Dokter '+d,i:'medical_services',c:'#0b5d73',b:'#e1ebee'};
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DW=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],BS=BLN.map(m=>m.slice(0,3));
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const mi=(n,l)=>`<span class="mi" ${l?`role="img" aria-label="${l}"`:'aria-hidden="true"'}>${n}</span>`;
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const tgl=s=>{const d=parse(s);return `${HARI[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]}`};
const esc=s=>String(s).replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`);
const today=ymd(new Date());
let S={slots:{},kontrol:[],catatan:{}},sel=today,pick=localStorage.nama||'',dok='Saraf',cloud=false,db,F,unsub,ed=null,wm='',nl=true,nerr=false;
const save=()=>localStorage.jagamamah=JSON.stringify(S);
const cnt=(d,h)=>(S.slots[d]?.[h]||[]).length;
const RH=56;
const past=(d,h)=>d<today||(d==today&&h<new Date().getHours());

async function apply(date,hrs,name,add){
  if(!hrs.length)return;
  if(cloud){const o={};hrs.forEach(h=>o[h]=(add?F.arrayUnion:F.arrayRemove)(name));await F.setDoc(F.doc(db,'jadwal',date),{slots:o},{merge:true})}
  else{const d=S.slots[date]??={};hrs.forEach(h=>{const a=d[h]??=[],i=a.indexOf(name);if(add&&i<0)a.push(name);if(!add&&i>=0)a.splice(i,1)});save();render()}
}
function range(date,s,e,name){
  const a=[],b=[],n=parse(date);n.setDate(n.getDate()+1);
  if(e>s)for(let h=s;h<e;h++)a.push(h);else{for(let h=s;h<24;h++)a.push(h);for(let h=0;h<e;h++)b.push(h)}
  const nd=ymd(n),A=a.filter(h=>!past(date,h)),B=b.filter(h=>!past(nd,h));
  if(!A.length&&!B.length)throw 0;
  return Promise.all([apply(date,A,name,true),apply(nd,B,name,true)]);
}

const week=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return ymd(x)})};
function go(date){sel=date;render()}
function mw(n){const d=parse(week(sel)[0]);d.setDate(d.getDate()+7*n);const w=week(ymd(d));sel=w.includes(today)?today:w[0];render()}

const dots=k=>Object.keys(NAMES).filter(n=>Object.values(S.slots[k]||{}).some(a=>a.includes(n))).map(n=>`<i style="background:${NAMES[n]}"></i>`).join('');
function cal(){
  const w=week(sel),a=parse(w[0]),z=parse(w[6]),ma=a.getMonth(),mz=z.getMonth(),ya=a.getFullYear(),yz=z.getFullYear();
  $('#lgd').innerHTML='<span>Pilih tanggal diatas. </span>'+Object.keys(NAMES).map(n=>`<span><i style="background:${NAMES[n]}"></i>${n}</span>`).join('');
  $('#mt').textContent=ma==mz?`${BLN[ma]} ${ya}`:`${BS[ma]}${ya==yz?'':' '+ya} – ${BS[mz]} ${yz}`;
  $('#cal').innerHTML=w.map((k,i)=>`<button class="day${k<today?' pd':''}${k==sel?' sel':''}${k==today?' today':''}" data-d="${k}" aria-pressed="${k==sel}"${k==today?' aria-current="date"':''}><span class="dow">${DW[i]}</span><b>${+k.slice(8)}</b><span class="dots">${dots(k)}</span>${S.kontrol.some(c=>c.date==k)?`<small>${mi('medical_services','Ada jadwal kontrol')}</small>`:''}</button>`).join('');
}
function tl(){
  const d=S.slots[sel]||{},nowH=sel==today?new Date().getHours():-1,old=sel<today,st=old?0:Math.max(nowH,0),N=24-st;
  const names=Object.keys(NAMES).filter(n=>Array.from({length:N},(_,k)=>d[st+k]).some(a=>a?.includes(n)));let low=0,hrs='',lanes='';
  for(let i=st;i<24;i++){const k=Math.min((d[i]||[]).length,2);if(k<2)low++;hrs+=`<div class="tm ${['bd','wn','ok'][k]}">${pad(i)}:00</div>`}
  names.forEach(n=>{let ev='';
    for(let i=st;i<24;i++){if(!d[i]?.includes(n))continue;let e=i;while(e<23&&d[e+1]?.includes(n))e++;
      ev+=`<button class="ev" style="top:${(i-st)*RH}px;height:${(e-i+1)*RH}px;--c:${NAMES[n]};--g:${NAMES[n]}2e" data-x="${i}|${n}"${old?' disabled':''}><b>Jaga</b><small>${pad(i)}-${pad(e+1)}</small></button>`;i=e}
    lanes+=`<div class="ln" data-lane="${n}" data-st="${st}">${ev}</div>`});
  const ks=S.kontrol.filter(c=>c.date==sel).map(c=>`<div class="kd">${mi('medical_services')} <b>Kontrol ${esc(kt(c.dokter).n)} jam ${esc(c.time)}</b>${c.catatan?`<br>Catatan: ${esc(c.catatan)}`:''}</div>`).join('');
  $('#dh').innerHTML=`<h2>${tgl(sel)}</h2>`+(old?'<p class="sub">Tanggal ini sudah lewat.</p>':`<span class="pill ${low?'wn':'ok'}">${low?`Masih kurang orang selama ${low} jam`:'Lengkap, semua jam sudah ada 2 orang'}</span>${ks}<p class="sub">Tekan kotak berwarna untuk membatalkan.</p>`);
  const g=`grid-template-columns:42px repeat(${names.length},minmax(0,1fr)) ${names.length?'46px':'1fr'}`;
  $('#tl').className=old?'old':'';
  $('#tl').innerHTML=N?`<div class="tgh" style="${g}"><div></div>${names.map(n=>`<div class="uh" style="--c:${NAMES[n]}">${n}</div>`).join('')}<button class="uh plus" data-add aria-label="Ikut jaga"${old?' disabled':''}>${mi('add')}${names.length?'':' Ikut jaga'}</button></div><div class="tgb" style="height:${N*RH}px;${g}"><div>${hrs}</div>${lanes}<div class="ln" data-lane="+" data-st="${st}">${names.length?'':`<p class="sub" style="padding:8px">${old?'Tidak ada data jaga di tanggal ini.':`Belum ada yang jaga. Tekan tombol ${mi('add')} di atas untuk menambah jadwal.`}</p>`}</div>${nowH>=0?`<div class="nowl" style="top:${new Date().getMinutes()/60*RH}px"></div>`:''}</div>`:'';
}
function kr(){
  const d=S.slots[sel]||{},st=sel<today?24:sel==today?new Date().getHours():0,g=[];
  for(let h=st;h<24;h++){
    const k=Math.min((d[h]||[]).length,2);if(k>1)continue;
    const l=g[g.length-1];if(l&&l.k==k&&l.e==h)l.e=h+1;else g.push({k,s:h,e:h+1});
  }
  $('#kr').innerHTML='<h2>Jam kosong atau baru 1 orang</h2><p class="sub">'+tgl(sel)+'.</p>'+
    (sel<today?'<p class="sub" style="margin-top:10px">Tanggal ini sudah lewat.</p>':
    g.length?g.map(x=>`<div class="gp ${['bd','wn'][x.k]}"><div><b>${x.k?'Dijaga 1 orang':'Kosong'}, ${x.e-x.s} jam</b><div class="gt">${pad(x.s)}:00 - ${pad(x.e%24)}:00</div></div><button data-g="${x.s}|${x.e}">Ambil jadwal</button></div>`).join(''):
    '<span class="pill ok">Lengkap, semua jam sudah ada 2 orang</span>');
}
function kc(){
  const up=S.kontrol.filter(c=>c.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),c=up[0],dd=c&&Math.round((parse(c.date)-parse(today))/864e5);
  const t=c&&kt(c.dokter);
  $('#kc').style.cssText=c?`--c:${t.c};--b:${t.b}`:'';
  $('#kc').innerHTML=(c?`<span class="kic">${mi(t.i)}</span><b>Kontrol dan Terapi berikutnya</b><div class="big">${esc(kt(c.dokter).n)}, ${dd?dd==1?'besok':dd+' hari lagi':'hari ini'}</div><p>${tgl(c.date)} jam ${esc(c.time)}${c.catatan?`<br>Catatan: ${esc(c.catatan)}`:''}</p>`:'<b>Belum ada jadwal kontrol dokter</b>')+'<button data-k>Lihat Semua Jadwal</button>';
  $('#kl').innerHTML=up.map(c=>{const t=kt(c.dokter),n=Math.round((parse(c.date)-parse(today))/864e5);return `<div class="kk" style="--c:${t.c};--b:${t.b}"><span class="kic">${mi(t.i)}</span><div class="kbd"><b>${esc(t.n)}</b><div class="kdt">${tgl(c.date)}</div><div class="kwr"><span class="kwh">${n?n==1?'Besok':n+' hari lagi':'Hari ini'}</span><b>Jam ${esc(c.time)}</b></div>${c.catatan?`<div class="kno">${mi('edit_note')} ${esc(c.catatan)}</div>`:''}</div><button data-del="${esc(c.id)}" aria-label="Hapus">${mi('delete')}</button></div>`}).join('')||'<p class="sub">Belum ada jadwal.</p>';
}
function sb(){
  const n=new Date(),h=n.getHours(),a=(S.slots[today]||{})[h]||[],k=Math.min(a.length,2),c=['bd','wn','ok'][k];
  $('#sb').className='card '+c;
  $('#sb').innerHTML=`<h2>Yang Sekarang Standby</h2><p class="sub">Sekarang jam ${pad(h)}:${pad(n.getMinutes())}</p><div class="sbn">${a.map(x=>`<span class="nm" style="background:${NAMES[x]||'#555'}">${esc(x)}</span>`).join('')||'<b>Belum ada yang jaga</b>'}</div><span class="pill ${c}">${['Kosong, segera cari penjaga','Kurang 1 orang','Aman, ada '+a.length+' orang'][k]}</span>`;
}
function grow(){
  const t=$('#ct'),y=scrollY;
  t.style.height='auto';
  t.style.height=t.scrollHeight+t.offsetHeight-t.clientHeight+'px';
  if(scrollY!=y)scrollTo(0,y);
}
function cn(){
  const d=ed||sel,t=$('#ct'),v=S.catatan[d]||'';
  document.body.classList.toggle('ed',!!ed);$('#cn').classList.toggle('editing',!!ed);
  $('#cnh').textContent='Catatan '+(d==today?'hari ini':tgl(d));
  t.readOnly=!ed;
  t.placeholder=ed?'Tulis catatan di sini…':nerr?'Catatan gagal dimuat. Cek internet.':nl?'Belum ada catatan.':'Memuat catatan…';
  if(!ed&&t.value!==v){t.value=v;grow()}
  const b=$('#ce');b.hidden=!!ed;b.disabled=!nl;b.innerHTML=mi('edit')+(v?'Edit':'Tulis');
  $('#cx').hidden=!ed;
}
function watch(){
  if(!cloud)return;
  const m=sel.slice(0,7);if(m==wm)return;
  wm=m;nl=false;nerr=false;unsub?.();
  unsub=F.onSnapshot(F.query(F.collection(db,'jadwal'),F.where(F.documentId(),'>=',m+'-01'),F.where(F.documentId(),'<=',m+'-31')),
    q=>{const o={};q.forEach(d=>{const x=d.data().catatan;if(x)o[d.id]=x;S.slots[d.id]=d.data().slots||{}});S.catatan=o;nl=true;nerr=false;render()},
    ()=>{nl=true;nerr=true;render()});
}
function render(){watch();sb();cal();tl();kc();cn();kr()}

const sH=$('#js'),eH=$('#je');
sH.innerHTML=eH.innerHTML=Array.from({length:24},(_,h)=>`<option value="${h}">${pad(h)}:00</option>`).join('');
eH.options[0].text='00:00 (tengah malam)';
function paint(){
  $('#pn').innerHTML=Object.keys(NAMES).map(n=>`<button data-n="${n}" class="${n==pick?'on':''}" style="--c:${NAMES[n]}">${n}</button>`).join('');
  const s=+sH.value,e=+eH.value,len=e>s?e-s:24-s+e;
  [...$('#ps').children].forEach(b=>b.classList.toggle('on',b.dataset.p==`${s}-${e}`));
  $('#jp').textContent=`${pick||'Pilih namamu dulu'}: jaga ${len} jam, dari ${pad(s)}:00 sampai ${e<=s?'besok ':''}${pad(e)}:00`;
}
function openJ(s,e){if(s===undefined){s=sel==today?Math.min(new Date().getHours()+1,23):6;e=(s+8)%24}$('#jd').min=today;$('#jd').value=sel<today?today:sel;sH.value=s;eH.value=e%24;paint();$('#dj').showModal()}
const paintK=()=>$('#kd').innerHTML=Object.entries(KT).map(([k,t])=>`<button data-v="${k}" class="${k==dok?'on':''}" style="--c:${t.c}">${mi(t.i)}${t.n.replace('Dokter ','Dr. ')}</button>`).join('');

$('#dj').addEventListener('change',paint);
$('#pv').onclick=()=>mw(-1);$('#nx').onclick=()=>mw(1);
$('#td').onclick=()=>go(today);$('#bj').onclick=()=>openJ();
$('#jok').onclick=async()=>{
  if(!pick)return alert('Pilih namamu dulu ya.');
  const date=$('#jd').value||sel;
  try{await range(date,+sH.value,+eH.value,pick)}catch(x){return alert(x===0?'Jam itu sudah lewat. Pilih jam yang belum lewat ya.':'Gagal menyimpan. Cek internet lalu coba lagi.')}
  localStorage.nama=pick;go(date);$('#dj').close();
};
$('#kok').onclick=async()=>{
  const o={dokter:dok,date:$('#kt').value,time:$('#kj').value||'09:00',catatan:$('#kn').value.trim()};
  if(!o.date)return alert('Pilih tanggal kontrol dulu ya.');
  try{if(cloud)await F.addDoc(F.collection(db,'kontrol'),o);else{S.kontrol.push({id:Date.now()+'',...o});save()}}catch{return alert('Gagal menyimpan. Cek internet lalu coba lagi.')}
  $('#kn').value='';go(o.date);$('#dk').close();
};
$('#ct').addEventListener('input',grow);
addEventListener('resize',grow);
document.fonts?.ready.then(grow);
$('#ce').onclick=()=>{
  ed=sel;cn();
  const t=$('#ct');t.focus();t.setSelectionRange(t.value.length,t.value.length);grow();
};
$('#cb').onclick=()=>{
  if($('#ct').value.trim()!==(S.catatan[ed]||'')&&!confirm('Tulisan belum disimpan. Buang perubahan?'))return;
  ed=null;cn();
};
$('#cs').onclick=async()=>{
  const b=$('#cs'),d=ed,text=$('#ct').value.trim();
  b.disabled=true;
  try{
    if(cloud)await F.setDoc(F.doc(db,'jadwal',d),{catatan:text},{merge:true});
    if(text)S.catatan[d]=text;else delete S.catatan[d];
    if(!cloud)save();
  }catch{b.disabled=false;return alert('Gagal menyimpan. Cek internet lalu coba lagi.')}
  b.disabled=false;ed=null;render();
};
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-d],[data-x],[data-lane],[data-add],[data-h],[data-p],[data-n],[data-v],[data-k],[data-del],[data-close],[data-g]');if(!t)return;
  const D=t.dataset;
  if('close' in D)t.closest('dialog').close();
  else if(D.d){sel=D.d;render()}
  else if(D.x){
    const[i,n]=D.x.split('|'),d=S.slots[sel]||{};let s=+i,en=+i;
    while(s>0&&d[s-1]?.includes(n))s--;while(en<23&&d[en+1]?.includes(n))en++;
    if(confirm(`Batalkan jaga ${n} jam ${pad(s)}:00 sampai ${pad(en+1)}:00?`))apply(sel,Array.from({length:en-s+1},(_,k)=>s+k),n,false).catch(()=>alert('Gagal membatalkan. Coba lagi.'));
  }
  else if(D.lane){const r=t.getBoundingClientRect(),h=+D.st+Math.floor((e.clientY-r.top)/RH);pick='';openJ(h,(h+1)%24)}
  else if('add' in D){pick='';openJ()}
  else if(D.g){const[s,e]=D.g.split('|').map(Number);openJ(s,e%24)}
  else if(D.p){[sH.value,eH.value]=D.p.split('-');paint()}
  else if(D.n){pick=D.n;paint()}
  else if(D.v){dok=D.v;paintK()}
  else if('k' in D){$('#kt').min=today;$('#kt').value=sel<today?today:sel;paintK();$('#dk').showModal()}
  else if(D.del&&confirm('Hapus jadwal kontrol ini?')){
    try{if(cloud)await F.deleteDoc(F.doc(db,'kontrol',D.del));else{S.kontrol=S.kontrol.filter(c=>c.id!=D.del);save();render()}}catch{alert('Gagal menghapus. Coba lagi.')}
  }
});

if(!C?.projectId||String(C.projectId).startsWith('ISI')){
  $('#mode').hidden=false;
  try{S={...S,...JSON.parse(localStorage.jagamamah||'{}')}}catch{}
  if(!S.catatan||Array.isArray(S.catatan))S.catatan={};
}else{
  const V='10.12.2',A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  db=F.getFirestore(A.initializeApp(C));cloud=true;
  F.onSnapshot(F.collection(db,'kontrol'),q=>{S.kontrol=q.docs.map(d=>({id:d.id,...d.data()}));render()});
  F.onSnapshot(F.query(F.collection(db,'jadwal'),F.where(F.documentId(),'>=',today)),q=>{q.forEach(d=>S.slots[d.id]=d.data().slots||{});render()});
}
render();
setInterval(render,20000);
</script>
</body>
</html>
